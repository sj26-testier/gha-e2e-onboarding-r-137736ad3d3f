name: pr-ignore
on:
  pull_request:
    branches: ["ignore-base"]
    types: [opened, synchronize]
    paths-ignore: ["docs/**"]
jobs:
  marker:
    name: pr-ignore marker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute evidence marker
        run: |
          printf 'PB3255_EXECUTED:%s:%s\n' 'pr-ignore' "$(git rev-parse HEAD)"
